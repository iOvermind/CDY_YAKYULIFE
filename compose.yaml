# 整台服務：app（前端＋API）、db、cloudflared。見 ADR 0038。
#
# **這份 compose 只描述要跑什麼，不做任何事。** 沒有啟動時安裝依賴、沒有啟動時
# 建置前端——程式碼是建進 image 的，容器起來就是直接跑。要更新就重建 image
# （`./deploy.sh`）再重新建立 app 這顆容器。
#
# 因此它可以交給 Dockhand 之類的容器管理介面：起、停、重啟、看記錄都在那邊，
# 這裡不搶著做。
#
# 需要的環境變數在 `.env`（同目錄，compose 會自動讀）。範本見 `.env.example`。
# **只有秘密走環境變數**——密碼、金鑰、權杖每台機器不同，不能進版控。路徑、埠這種
# 結構性的東西直接寫在這份檔案裡（見 ADR 0040）。
#
# 秘密的值一律用 `${VAR}` 帶進來，**不加 `:?` 的必填檢查**——加了的話，管理介面在
# 還沒給值之前連這份檔案都解析不開，等於逼所有人先去弄一個 .env 才看得到內容。要直接
# 把值寫死在這裡（或填在管理介面的環境變數欄）都行。
#
# **不用 Redis**——這個規模 Postgres 一個人吃得下，多一個容器只是多一處狀態
# 不一致的來源。
services:
  app:
    # `./deploy.sh` 建出來的。compose 不負責 build——build 與 run 分開，才不會
    # 「重啟一下」變成「順手換了一個版本」。
    image: ${APP_IMAGE:-cdy_yakyulife:latest}
    environment:
      DATABASE_URL: postgres://yakyu:${POSTGRES_PASSWORD}@db:5432/yakyu
      # 沒設的話伺服器會用隨機金鑰，重啟後所有人被登出（伺服器會在記錄裡喊一聲）。
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      PORT: 8080
    # 對外走 tunnel，這個埠是**給本機驗證用的**——tunnel 還沒設好之前也要能
    # `curl localhost:8080` 確認服務真的起來了。預設只綁 127.0.0.1，不對區網開。
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:8080"
    # 讓 cloudflared 等到 API 真的回話再上線，也讓管理介面上的狀態是「活著」
    # 而不只是「行程還在」。image 是 node:alpine，busybox 的 wget 就夠用。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yakyu
      # 沒設的話 postgres 會拒絕初始化並在記錄裡說明，不會安靜地開一個沒密碼的庫。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: yakyu
    # 資料放 repo 底下的 data/，不用具名 volume：備份就是複製一個資料夾，搬機器
    # 就是搬那個資料夾。代價是那個目錄由 Postgres 容器持有，宿主機上要用 sudo
    # 才動得了。
    #
    # **這一格是寫死的絕對路徑，不是環境變數**——資料庫放哪裡不是秘密，是這個專案
    # 的結構事實。秘密（密碼、金鑰、權杖）才需要變數：它們每台機器不同、不能進版控。
    # 見 ADR 0040。
    #
    # 搬機器時改的是這一行，那是 commit 得起來的動作；忘記貼一個環境變數則不是。
    volumes:
      - /home/overmind/docker/CDY_YAKYULIFE/data/pg:/var/lib/postgresql/data
    # 資料庫不對外開埠。要進去下 SQL 用
    # `docker compose exec db psql -U yakyu -d yakyu`——開一個 5432 出去只是多一個
    # 要防的東西。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yakyu"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflare Zero Trust → Networks → Tunnels 建立通道後拿到的權杖。
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    # tunnel 的 public hostname 在 Cloudflare 的介面上設，service 填
    # **http://app:8080**——它跟 app 在同一個 compose 網路裡，不必經過上面那個
    # 綁在 127.0.0.1 的埠。
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
